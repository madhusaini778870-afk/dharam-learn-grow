services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Vite needs polling for bind-mount file watching inside containers.
      - CHOKIDAR_USEPOLLING=true
      - VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh dev-base44.sh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules:
